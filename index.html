<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050508" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="manifest" href="/manifest.json" />

    <style>
      /* Suppress any Netlify deploy preview floating drawer/badge */
      iframe#netlify-drawer,
      div#netlify-drawer,
      div[data-netlify-drawer],
      [id*="netlify-drawer"],
      [class*="netlify-drawer"],
      [id*="netlify-identity"],
      [class*="netlify-badge"],
      [id*="netlify-badge"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>
  </head>
  <body class="bg-[#050508] text-white antialiased selection:bg-emerald-500 selection:text-black">
