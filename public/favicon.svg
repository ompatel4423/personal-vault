<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="50%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#020203" />
    </linearGradient>

    <!-- Outer Bezel Ring -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4" />
    </linearGradient>

    <!-- Rear Card Gradient -->
    <linearGradient id="rearCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Front Emerald Vault Card -->
    <linearGradient id="emeraldCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Gold EMV Chip -->
    <linearGradient id="goldChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Wallet Pocket Gradient -->
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1f26" />
      <stop offset="100%" stop-color="#0d0d12" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle (App Store Standard rx=114 on 512x512) -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="509" height="509" rx="112.5" fill="none" stroke="url(#bezelGrad)" stroke-width="3" />

  <!-- Ambient Emerald Radial Flare behind cards -->
  <circle cx="256" cy="220" r="140" fill="#10b981" opacity="0.12" filter="url(#emeraldGlow)" />

  <!-- ================= REAR CARD (Passport / Blue Identity) ================= -->
  <g filter="url(#dropShadow)" transform="rotate(-6 256 220)">
    <rect x="110" y="110" width="292" height="175" rx="20" fill="url(#rearCardGrad)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" />
    <!-- Rear card design lines -->
    <circle cx="360" cy="150" r="22" fill="#38bdf8" opacity="0.15" />
    <path d="M 135 150 Q 200 135 280 150" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" fill="none" />
  </g>

  <!-- ================= FRONT EMERALD VAULT CARD ================= -->
  <g filter="url(#dropShadow)" transform="rotate(3 256 240)">
    <rect x="100" y="145" width="312" height="185" rx="22" fill="url(#emeraldCardGrad)" stroke="#6ee7b7" stroke-opacity="0.4" stroke-width="2" />

    <!-- Card Holographic Pattern Wave -->
    <path d="M 100 240 C 180 200, 240 280, 412 210 L 412 330 L 100 330 Z" fill="#047857" opacity="0.3" />

    <!-- Golden Metallic EMV Chip -->
    <rect x="135" y="180" width="48" height="36" rx="6" fill="url(#goldChip)" stroke="#fef08a" stroke-opacity="0.6" stroke-width="1" />
    <path d="M 147 180 L 147 216 M 171 180 L 171 216 M 135 198 L 183 198" stroke="#854d0e" stroke-width="1.2" opacity="0.7" />

    <!-- Contactless Wave -->
    <path d="M 205 186 A 14 14 0 0 1 205 210" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 213 181 A 22 22 0 0 1 213 215" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />

    <!-- Monogram / Lock Symbol on Card -->
    <g transform="translate(345, 175)">
      <circle cx="18" cy="18" r="18" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
      <path d="M 13 16 L 13 14 A 5 5 0 0 1 23 14 L 23 16" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <rect x="11" y="16" width="14" height="11" rx="2" fill="#ffffff" />
    </g>

    <!-- Card Number Dots simulation -->
    <circle cx="140" cy="285" r="4" fill="#ffffff" opacity="0.8" />
    <circle cx="152" cy="285" r="4" fill="#ffffff" opacity="0.8" />
    <circle cx="164" cy="285" r="4" fill="#ffffff" opacity="0.8" />
    <circle cx="176" cy="285" r="4" fill="#ffffff" opacity="0.8" />

    <circle cx="198" cy="285" r="4" fill="#ffffff" opacity="0.8" />
    <circle cx="210" cy="285" r="4" fill="#ffffff" opacity="0.8" />
    <circle cx="222" cy="285" r="4" fill="#ffffff" opacity="0.8" />
    <circle cx="234" cy="285" r="4" fill="#ffffff" opacity="0.8" />

    <text x="350" y="290" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" opacity="0.9" letter-spacing="1">OM'S</text>
  </g>

  <!-- ================= LUXURY LEATHER / TITANIUM WALLET POCKET ================= -->
  <g filter="url(#dropShadow)">
    <!-- Pocket main body -->
    <path d="M 70 290 Q 256 320 442 290 L 442 430 A 24 24 0 0 1 418 454 L 94 454 A 24 24 0 0 1 70 430 Z" fill="url(#pocketGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

    <!-- Elegant Leather Stitching Row -->
    <path d="M 76 298 Q 256 326 436 298" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.5" />

    <!-- Center Security Emblem Badge on Wallet -->
    <g transform="translate(256, 375)">
      <circle cx="0" cy="0" r="32" fill="#14141a" stroke="#34d399" stroke-width="2.5" />
      <circle cx="0" cy="0" r="38" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />

      <!-- Stylized Shield & Keyhole -->
      <path d="M 0 -16 L 14 -10 L 14 4 C 14 14, 0 20, 0 20 C 0 20, -14 14, -14 4 L -14 -10 Z" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="2" stroke-linejoin="round" />
      <circle cx="0" cy="-2" r="3" fill="#34d399" />
      <path d="M 0 1 L 0 8" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Subtle Brand Wordmark on Pocket -->
    <text x="256" y="432" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#ffffff" fill-opacity="0.45">SECURE VAULT</text>
  </g>
</svg>